services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: iap
      POSTGRES_USER: iap
      POSTGRES_PASSWORD: local-development-only
    ports: ["5432:5432"]
    volumes: ["iap_postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iap -d iap"]
      interval: 5s
      timeout: 5s
      retries: 12
  app:
    build: .
    env_file: .env
    ports: ["3000:3000"]
    depends_on:
      db: { condition: service_healthy }
    volumes: ["iap_storage:/app/storage"]
    command: ["sh", "-c", "npx prisma migrate deploy && npm run start"]
volumes:
  iap_postgres:
  iap_storage:
